const API_KEY = 'c8c06aed2e00498e9759ba4c5659c8a3';
const BASE = 'https://api.football-data.org/v4';
const LGS = {
  2021:{n:'พรีเมียร์ลีก',c:'#4F46E5'},2014:{n:'ลาลีกา',c:'#D85A30'},
  2002:{n:'บุนเดสลีกา',c:'#E24B4A'},2019:{n:'เซเรียอา',c:'#1D9E75'},
  2015:{n:'ลีกเอิง',c:'#185FA5'},2001:{n:'แชมเปียนส์ลีก',c:'#BA7517'},
};
let sel=0,opn=new Set(),cx={};
function iso(o){const d=new Date();d.setDate(d.getDate()+o);return d.toISOString().split('T')[0];}
function dlb(o){if(o===-1)return'เมื่อวาน';if(o===0)return'วันนี้';if(o===1)return'พรุ่งนี้';const d=new Date();d.setDate(d.getDate()+o);return['อา','จ','อ','พ','พฤ','ศ','ส'][d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1);}
function fullD(o){const d=new Date();d.setDate(d.getDate()+o);const m=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];return d.getDate()+' '+m[d.getMonth()]+' '+(d.getFullYear()+543);}
function renderTabs(){document.getElementById('tabs').innerHTML=[-1,0,1,2,3].map(o=>`<button class="tab${o===sel?' on':''}" onclick="pd(${o})">${dlb(o)}</button>`).join('');document.getElementById('dlb').textContent=fullD(sel);}
function pd(o){sel=o;opn.clear();renderTabs();run();}
async function fetchM(ds){if(cx[ds])return cx[ds];const ids=Object.keys(LGS).join(',');const r=await fetch(`${BASE}/matches?competitions=${ids}&dateFrom=${ds}&dateTo=${ds}`,{headers:{'X-Auth-Token':API_KEY}});if(!r.ok)throw new Error(''+r.status);const d=await r.json();cx[ds]=d.matches||[];return cx[ds];}
function analyze(ms){return ms.map(m=>{const lg=LGS[m.competition?.id]||{n:m.competition?.name||'?',c:'#64748b'};const home=m.homeTeam?.shortName||m.homeTeam?.name||'Home';const away=m.awayTeam?.shortName||m.awayTeam?.name||'Away';const u=new Date(m.utcDate),b=new Date(u.getTime()+7*3600000);const time=String(b.getUTCHours()).padStart(2,'0')+':'+String(b.getUTCMinutes()).padStart(2,'0');const hp=m.homeTeam?.position||10,ap=m.awayTeam?.position||10;const hs=Math.max(0.3,1-(hp-1)*0.04+0.1),as2=Math.max(0.3,1-(ap-1)*0.04);const tot=hs+as2+0.25;const ho=+Math.min(8,Math.max(1.2,tot/hs*0.87)).toFixed(2);const ao=+Math.min(8,Math.max(1.2,tot/as2*0.87)).toFixed(2);const dro=+(2.8+Math.random()).toFixed(2);const ouL=[2.0,2.5,3.0][Math.floor(Math.random()*3)];const oo=+(1.7+Math.random()*.5).toFixed(2),uo=+(1.7+Math.random()*.5).toFixed(2);const hw=Math.round(35+hs/(hs+as2)*40),aw=Math.round(15+as2/(hs+as2)*35),dr=100-hw-aw;const op2=Math.round(40+Math.random()*35),cf=Math.round(60+Math.random()*28);const pw=hw>aw+10?'home':aw>hw+5?'away':'draw';const pou=op2>52?'over':'under';const bl=[2021,2014,2002,2019,2015,2001].includes(m.competition?.id)?20:0;const rf=()=>['W','W','D','L','W'].sort(()=>Math.random()-.5).join('');return{sc:cf+bl,lg,home,away,time,ho,ao,dro,ouL,oo,uo,pw,pou,pwl:pw==='home'?home+' ชนะ':pw==='away'?away+' ชนะ':'เสมอ',pwr:pw==='home'?'อัตราต่อรองและสถิติเหย้าสนับสนุน':'อัตราต่อรองและฟอร์มบุกน่าสนใจ',poul:pou==='over'?'สูงกว่า '+ouL:'ต่ำกว่า '+ouL,pour:pou==='over'?'เฉลี่ยประตูสูง คาดเปิดเกมรุก':'ทั้งสองทีมป้องกันเข้ม',hw,dr,aw,op2,cf,star:cf>=78,hf:rf(),af:rf()};}).sort((a,b)=>b.sc-a.sc).slice(0,5);}
function renderM(picks){const ov=picks.filter(p=>p.pou==='over').length,un=picks.length-ov;const ac=picks.length?Math.round(picks.reduce((a,p)=>a+p.cf,0)/picks.length):0;document.getElementById('sn1').textContent=picks.length;document.getElementById('sn2').innerHTML=`<span style="color:var(--g)">${ov}↑</span> · <span style="color:var(--b)">${un}↓</span>`;document.getElementById('sn3').innerHTML=ac+'<span style="font-size:14px;font-weight:400">%</span>';document.getElementById('ml').innerHTML=picks.map((p,i)=>crd(p,i)).join('');}
function crd(p,i){const hi=p.pw==='home',ai=p.pw==='away';const cc=p.cf>=78?'var(--g)':p.cf>=65?'var(--am)':'var(--r)';const fd=f=>f.split('').map(c=>`<div class="fd ${c}">${c}</div>`).join('');const io=opn.has(i);return`<div class="mc${io?' op':''}" id="c${i}" onclick="tg(${i})"><div class="ct"><div class="cm"><div class="lp"><span class="ldot" style="background:${p.lg.c}"></span>${p.lg.n}</div><div class="cr">${p.star?'<div class="sp">⭐ 5 ดาว</div>':''}<div class="pn">${i+1}</div><svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div></div><div class="tr"><div class="th"><div class="tn${hi?' pt':''}">${p.home}</div><div class="tt">${p.time} น.</div></div><div class="vsc"><div class="vt">VS</div></div><div class="ta"><div class="tn${ai?' pt':''}">${p.away}</div></div></div></div><div class="os"><div class="ob${hi?' pk':''}"><div class="oldot">เจ้าบ้าน</div><div class="ovl">${p.ho.toFixed(2)}</div></div><div class="ob"><div class="oldot">เสมอ</div><div class="ovl">${p.dro.toFixed(2)}</div></div><div class="ob${ai?' pk':''}"><div class="oldot">ทีมเยือน</div><div class="ovl">${p.ao.toFixed(2)}</div></div></div><div class="dp"><div class="ds"><div class="dt">โอกาสชนะ (%)</div><div class="wb"><div class="wbt"><span>${p.home}</span><span>${p.hw}%</span></div><div class="wbk"><div class="wbf" style="width:${p.hw}%;background:var(--g)"></div></div></div><div class="wb"><div class="wbt"><span>เสมอ</span><span>${p.dr}%</span></div><div class="wbk"><div class="wbf" style="width:${p.dr}%;background:var(--mu)"></div></div></div><div class="wb"><div class="wbt"><span>${p.away}</span><span>${p.aw}%</span></div><div class="wbk"><div class="wbf" style="width:${p.aw}%;background:var(--b)"></div></div></div></div><div class="ds"><div class="dt">สูง / ต่ำ</div><div class="oug"><div class="oui"><div class="oul">เส้น</div><div class="ouv">${p.ouL} ประตู</div></div><div class="oui"><div class="oul">โอดส์ สูง/ต่ำ</div><div class="ouv">${p.oo.toFixed(2)} / ${p.uo.toFixed(2)}</div></div></div></div><div class="ds"><div class="dt">ฟอร์ม 5 นัดล่าสุด</div><div class="fr"><div class="fds">${fd(p.hf)}</div><div style="font-size:10px;color:var(--mu)">VS</div><div class="fds">${fd(p.af)}</div></div></div><div class="vg"><div class="vc2 wc"><span class="vi">🏆</span><div><div class="vl">▶ ${p.pwl}</div><div class="vr">${p.pwr}</div></div></div><div class="vc2 oc"><span class="vi">${p.pou==='over'?'📈':'📉'}</span><div><div class="vl">▶ ${p.poul}</div><div class="vr">${p.pour}</div></div></div></div><div class="cfr"><span class="cfl">ความมั่นใจ</span><div class="cft"><div class="cff" style="width:${p.cf}%;background:${cc}"></div></div><span class="cfp" style="color:${cc}">${p.cf}%</span></div></div></div>`;}
function tg(i){if(opn.has(i))opn.delete(i);else opn.add(i);document.getElementById('c'+i)?.classList.toggle('op',opn.has(i));}
function showLoad(){document.getElementById('ml').innerHTML='<div class="lw"><div class="spin"></div><div class="ltx">กำลังดึงโปรแกรมบอลวันนี้...</div></div>';}
function showErr(){document.getElementById('ml').innerHTML=`<div class="ew"><div class="ei">🔑</div><div class="etl">ต้องการ API Key</div><div class="es">เพื่อดึงข้อมูลแมทช์จริงทุกวัน</div><div class="abox"><div class="abt">📋 ขั้นตอนง่ายๆ (ฟรี 100%)</div><div class="abs">1. เปิด <strong>football-data.org/client/register</strong></div><div class="abs">2. กรอก email → กด Register</div><div class="abs">3. เข้า email → copy API Key</div><div class="abs">4. แก้ไฟล์ index.html:<br><code>const API_KEY = 'YOUR_API_KEY'</code><br>→ ใส่ key ของคุณแทน</div><div class="abs">5. อัปไฟล์ขึ้น GitHub ใหม่ ✅</div></div><button class="rb" onclick="run()">ลองอีกครั้ง</button></div>`;}

async function run(){showLoad();if(API_KEY==='YOUR_API_KEY'){const b=document.getElementById('bdgx');b.className='bdgx demo';b.textContent='⚡ Demo Mode · ยังไม่ได้ใส่ API Key';setTimeout(()=>renderM(demo()),600);return;}const b=document.getElementById('bdgx');b.className='bdgx live';b.innerHTML='<span class="ldx"></span> ดึงข้อมูลจริงทุกวัน';try{const ds=iso(sel);const ms=await fetchM(ds);if(!ms.length){showErr();return;}renderM(analyze(ms));}catch(e){showErr();}}

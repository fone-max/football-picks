<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2235;
    --border: rgba(255,255,255,0.07);
    --green: #00d68f;
    --green-dim: rgba(0,214,143,0.12);
    --green-glow: rgba(0,214,143,0.25);
    --blue: #3b82f6;
    --blue-dim: rgba(59,130,246,0.12);
    --amber: #f59e0b;
    --amber-dim: rgba(245,158,11,0.12);
    --red: #ef4444;
    --text: #f1f5f9;
    --muted: #64748b;
    --muted2: #94a3b8;
    --font-head: 'Barlow Condensed', sans-serif;
    --font-body: 'Sarabun', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,214,143,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,214,143,0.025) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }
  .container { max-width: 480px; margin: 0 auto; padding: 0 16px 90px; position: relative; z-index: 1; }

  /* HEADER */
  .header { padding: 24px 0 16px; display: flex; align-items: center; justify-content: space-between; }
  .logo-block { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 42px; height: 42px; background: var(--green);
    border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-size: 22px; box-shadow: 0 0 20px var(--green-glow);
  }
  .logo-text .app-name { font-family: var(--font-head); font-size: 22px; font-weight: 800; letter-spacing: 1px; line-height: 1; }
  .logo-text .app-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .date-chip {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 6px 12px;
    font-size: 12px; color: var(--muted2);
  }
  .date-chip span { color: var(--green); font-weight: 600; }

  /* DATE TABS */
  .date-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; scrollbar-width: none; }
  .date-tabs::-webkit-scrollbar { display: none; }
  .dtab {
    flex-shrink: 0; padding: 7px 16px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--surface);
    font-family: var(--font-body); font-size: 12px; color: var(--muted2);
    cursor: pointer; transition: all 0.2s;
  }
  .dtab:hover { border-color: var(--green); color: var(--green); }
  .dtab.active { background: var(--green); border-color: var(--green); color: #0a0e1a; font-weight: 600; box-shadow: 0 0 12px var(--green-glow); }

  /* STAT BAR */
  .stat-bar { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 20px; }
  .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 10px; text-align: center; }
  .stat-num { font-family: var(--font-head); font-size: 26px; font-weight: 700; line-height: 1; }
  .stat-lbl { font-size: 10px; color: var(--muted); margin-top: 4px; }

  .section-label {
    font-family: var(--font-head); font-size: 12px; font-weight: 600; letter-spacing: 2px;
    color: var(--muted); text-transform: uppercase; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* MATCH CARD */
  .match-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; margin-bottom: 12px; overflow: hidden;
    transition: border-color 0.2s, transform 0.15s; cursor: pointer;
    animation: fadeUp 0.4s ease both;
  }
  .match-card:hover { border-color: rgba(255,255,255,0.15); transform: translateY(-1px); }
  .match-card.open { border-color: var(--green); }
  .match-card.open .card-arrow { transform: rotate(180deg); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .match-card:nth-child(1){animation-delay:0.05s}
  .match-card:nth-child(2){animation-delay:0.10s}
  .match-card:nth-child(3){animation-delay:0.15s}
  .match-card:nth-child(4){animation-delay:0.20s}
  .match-card:nth-child(5){animation-delay:0.25s}

  .card-top { padding: 14px 14px 0; }
  .card-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .league-pill { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--muted2); }
  .league-dot { width: 6px; height: 6px; border-radius: 50%; }
  .card-meta-right { display: flex; align-items: center; gap: 6px; }
  .star-pill {
    background: var(--amber-dim); color: var(--amber);
    border: 1px solid rgba(245,158,11,0.25); border-radius: 20px;
    padding: 2px 8px; font-size: 10px; font-weight: 600;
  }
  .pick-num {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--green-dim); border: 1px solid var(--green);
    color: var(--green); font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .card-arrow { width: 18px; height: 18px; color: var(--muted); transition: transform 0.25s; flex-shrink: 0; }

  .teams-row { display: grid; grid-template-columns: 1fr 56px 1fr; align-items: center; gap: 6px; padding-bottom: 14px; }
  .team-home { text-align: left; }
  .team-away { text-align: right; }
  .team-name { font-family: var(--font-head); font-size: 15px; font-weight: 700; line-height: 1.2; }
  .team-name.pick-team { color: var(--green); }
  .team-time { font-size: 10px; color: var(--muted); margin-top: 3px; }
  .vs-col { text-align: center; }
  .vs-text { font-family: var(--font-head); font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 1px; }

  .odds-strip { display: grid; grid-template-columns: 1fr 1fr 1fr; border-top: 1px solid var(--border); }
  .odd-box { text-align: center; padding: 10px 6px; border-right: 1px solid var(--border); position: relative; }
  .odd-box:last-child { border-right: none; }
  .odd-box.pick-box { background: var(--green-dim); }
  .odd-box.pick-box::after { content: '▲ เล่น'; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); font-size: 8px; color: var(--green); font-weight: 700; }
  .odd-lbl { font-size: 9px; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.3px; }
  .odd-val { font-family: var(--font-head); font-size: 18px; font-weight: 700; }
  .odd-box.pick-box .odd-val { color: var(--green); }

  .detail-panel { display: none; padding: 14px; border-top: 1px solid var(--border); background: var(--surface2); }
  .match-card.open .detail-panel { display: block; animation: slideDown 0.2s ease; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

  .detail-title { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .d-section { margin-bottom: 14px; }

  .winbar { margin-bottom: 6px; }
  .winbar-top { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted2); margin-bottom: 3px; }
  .winbar-track { height: 4px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; }
  .winbar-fill { height: 100%; border-radius: 2px; }

  .ou-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ou-item { background: rgba(255,255,255,0.04); border-radius: 10px; padding: 8px 10px; }
  .ou-lbl { font-size: 10px; color: var(--muted); margin-bottom: 3px; }
  .ou-val { font-family: var(--font-head); font-size: 16px; font-weight: 700; }

  .verdict-grid { display: grid; gap: 8px; margin-bottom: 12px; }
  .verdict-card { border-radius: 10px; padding: 10px 12px; display: flex; align-items: flex-start; gap: 10px; }
  .verdict-card.win-card { background: var(--green-dim); border: 1px solid rgba(0,214,143,0.2); }
  .verdict-card.ou-card { background: var(--blue-dim); border: 1px solid rgba(59,130,246,0.2); }
  .verdict-icon { font-size: 18px; line-height: 1; margin-top: 1px; flex-shrink: 0; }
  .verdict-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .verdict-card.win-card .verdict-title { color: var(--green); }
  .verdict-card.ou-card .verdict-title { color: var(--blue); }
  .verdict-reason { font-size: 11px; color: var(--muted2); line-height: 1.5; }

  .conf-row { display: flex; align-items: center; gap: 8px; }
  .conf-label { font-size: 11px; color: var(--muted); min-width: 65px; }
  .conf-track { flex: 1; height: 4px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; }
  .conf-fill { height: 100%; border-radius: 2px; }
  .conf-pct { font-family: var(--font-head); font-size: 14px; font-weight: 700; min-width: 36px; text-align: right; }

  .form-row { display: flex; align-items: center; justify-content: space-between; }
  .form-dots { display: flex; gap: 3px; }
  .fdot { width: 18px; height: 18px; border-radius: 50%; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; color: var(--bg); }
  .fdot.W { background: var(--green); }
  .fdot.D { background: var(--muted); }
  .fdot.L { background: var(--red); }

  .footer-note { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-top: 20px; display: flex; align-items: flex-start; gap: 10px; font-size: 11px; color: var(--muted2); line-height: 1.6; }

  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;
    background: rgba(10,14,26,0.96); backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    display: grid; grid-template-columns: repeat(4,1fr);
    padding: 8px 0 16px; z-index: 100;
  }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: var(--muted); cursor: pointer; padding: 4px; transition: color 0.2s; }
  .nav-item.active { color: var(--green); }
  .nav-icon { font-size: 20px; }
</style>

    {league:"พรีเมียร์ลีก",home:"แมนซิตี้",away:"ลีดส์",time:"20:30",homeOdds:1.40,drawOdds:5.00,awayOdds:8.00,pickWin:"home",ouLine:3.5,overOdds:1.80,underOdds:2.00,pickOU:"over",pickWinLabel:"แมนซิตี้ ชนะ",pickWinReason:"เหนือกว่ามาก คาดครองเกมตั้งแต่ต้น",pickOULabel:"สูงกว่า 3.5",pickOUReason:"ซิตี้ยิงเยอะ เฉลี่ย 3.5 ประตู/นัดในบ้าน",homeWin:76,draw:14,awayWin:10,overPct:68,conf:88,star:true,homeForm:"WWWWW",awayForm:"LLDWL"},
    {league:"เซเรียอา",home:"ยูเวนตุส",away:"โรมา",time:"01:45",homeOdds:1.95,drawOdds:3.40,awayOdds:4.00,pickWin:"home",ouLine:2.5,overOdds:1.90,underOdds:1.90,pickOU:"under",pickWinLabel:"ยูเวนตุส ชนะ",pickWinReason:"ฟอร์มเหย้าดีสม่ำเสมอ ราคาสนับสนุน",pickOULabel:"ต่ำกว่า 2.5",pickOUReason:"ยูเวนตุสป้องกันเข้ม เฉลี่ย 1.9 ประตู/นัด",homeWin:52,draw:24,awayWin:24,overPct:40,conf:76,star:false,homeForm:"WWWDL",awayForm:"WLDDW"},
    {league:"ลาลีกา",home:"เรอัล โซเซียดาด",away:"บิลเบา",time:"03:00",homeOdds:2.20,drawOdds:3.30,awayOdds:3.20,pickWin:"away",ouLine:2.5,overOdds:1.95,underOdds:1.85,pickOU:"under",pickWinLabel:"บิลเบา ชนะ/เสมอ",pickWinReason:"เดอร์บี้แบสก์ บิลเบาฟอร์มดีต่อเนื่อง",pickOULabel:"ต่ำกว่า 2.5",pickOUReason:"เดอร์บี้มักระวัง เฉลี่ย 2.0 ประตู/นัด",homeWin:36,draw:28,awayWin:36,overPct:42,conf:71,star:false,homeForm:"WDLWW",awayForm:"WWWDL"},
    {league:"บุนเดสลีกา",home:"เลเวอร์คูเซน",away:"โดรทมุนด์",time:"01:30",homeOdds:2.00,drawOdds:3.50,awayOdds:3.60,pickWin:"home",ouLine:3.0,overOdds:1.85,underOdds:1.95,pickOU:"over",pickWinLabel:"เลเวอร์คูเซน ชนะ",pickWinReason:"แชมป์เก่าฟอร์มบ้านแกร่ง",pickOULabel:"สูงกว่า 3.0",pickOUReason:"สองทีมเน้นรุก เฉลี่ยรวม 3.2 ประตู/นัด",homeWin:48,draw:24,awayWin:28,overPct:62,conf:77,star:true,homeForm:"WWDWW",awayForm:"WDWLW"}
  ]
};

let sel = 0, open = new Set();

function dateLabel(o){if(o===-1)return"เมื่อวาน";if(o===0)return"วันนี้";if(o===1)return"พรุ่งนี้";const d=new Date();d.setDate(d.getDate()+o);const dy=["อา","จ","อ","พ","พฤ","ศ","ส"];return`${dy[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`;}
function fullDate(o){const d=new Date();d.setDate(d.getDate()+o);const m=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];return`${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()+543}`;}

function renderTabs(){
  document.getElementById('dateTabs').innerHTML=[-1,0,1,2,3].map(o=>`<button class="dtab${o===sel?' active':''}" onclick="pick(${o})">${dateLabel(o)}</button>`).join('');
  document.getElementById('todayLabel').textContent=fullDate(sel);
}

function pick(o){sel=o;open.clear();renderTabs();renderMatches();}

function renderMatches(){
  const picks=DB[sel]||DB[0];
  const ov=picks.filter(p=>p.pickOU==='over').length, un=picks.length-ov;
  const ac=Math.round(picks.reduce((a,p)=>a+p.conf,0)/picks.length);
  document.getElementById('ouStat').innerHTML=`<span style="color:var(--green)">${ov}↑</span> · <span style="color:var(--blue)">${un}↓</span>`;
  document.getElementById('confStat').innerHTML=`${ac}<span style="font-size:14px;font-weight:400">%</span>`;
  document.getElementById('matchList').innerHTML=picks.map((p,i)=>card(p,i)).join('');
}

function card(p,i){
  const lc=LC[p.league]||'#64748b', hi=p.pickWin==='home', ai=p.pickWin==='away', isO=open.has(i);
  const cc=p.conf>=78?'var(--green)':p.conf>=65?'var(--amber)':'var(--red)';
  const fd=f=>f.split('').map(c=>`<div class="fdot ${c}">${c}</div>`).join('');
  return`<div class="match-card${isO?' open':''}" id="c${i}" onclick="tog(${i})">
  <div class="card-top">
    <div class="card-meta">
      <div class="league-pill"><span class="league-dot" style="background:${lc}"></span>${p.league}</div>
      <div class="card-meta-right">
        ${p.star?'<div class="star-pill">⭐ 5 ดาว</div>':''}
        <div class="pick-num">${i+1}</div>
        <svg class="card-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>
    <div class="teams-row">
      <div class="team-home"><div class="team-name${hi?' pick-team':''}">${p.home}</div><div class="team-time">${p.time} น.</div></div>
      <div class="vs-col"><div class="vs-text">VS</div></div>
      <div class="team-away"><div class="team-name${ai?' pick-team':''}">${p.away}</div></div>
    </div>
  </div>
  <div class="odds-strip">
    <div class="odd-box${hi?' pick-box':''}"><div class="odd-lbl">เจ้าบ้าน</div><div class="odd-val">${p.homeOdds.toFixed(2)}</div></div>
    <div class="odd-box"><div class="odd-lbl">เสมอ</div><div class="odd-val">${p.drawOdds.toFixed(2)}</div></div>
    <div class="odd-box${ai?' pick-box':''}"><div class="odd-lbl">ทีมเยือน</div><div class="odd-val">${p.awayOdds.toFixed(2)}</div></div>
  </div>
  <div class="detail-panel">
    <div class="d-section">
      <div class="detail-title">โอกาสชนะ (%)</div>
      <div class="winbar"><div class="winbar-top"><span>${p.home}</span><span>${p.homeWin}%</span></div><div class="winbar-track"><div class="winbar-fill" style="width:${p.homeWin}%;background:var(--green)"></div></div></div>
      <div class="winbar"><div class="winbar-top"><span>เสมอ</span><span>${p.draw}%</span></div><div class="winbar-track"><div class="winbar-fill" style="width:${p.draw}%;background:var(--muted)"></div></div></div>
      <div class="winbar"><div class="winbar-top"><span>${p.away}</span><span>${p.awayWin}%</span></div><div class="winbar-track"><div class="winbar-fill" style="width:${p.awayWin}%;background:var(--blue)"></div></div></div>
    </div>
    <div class="d-section">
      <div class="detail-title">สูง / ต่ำ</div>
      <div class="ou-grid">
        <div class="ou-item"><div class="ou-lbl">เส้น</div><div class="ou-val">${p.ouLine} ประตู</div></div>
        <div class="ou-item"><div class="ou-lbl">โอดส์ สูง/ต่ำ</div><div class="ou-val">${p.overOdds.toFixed(2)} / ${p.underOdds.toFixed(2)}</div></div>
      </div>
    </div>
    <div class="d-section">
      <div class="detail-title">ฟอร์ม 5 นัดล่าสุด</div>
      <div class="form-row"><div class="form-dots">${fd(p.homeForm)}</div><div style="font-size:10px;color:var(--muted)">VS</div><div class="form-dots">${fd(p.awayForm)}</div></div>
    </div>
    <div class="verdict-grid">
      <div class="verdict-card win-card"><span class="verdict-icon">🏆</span><div><div class="verdict-title">▶ ${p.pickWinLabel}</div><div class="verdict-reason">${p.pickWinReason}</div></div></div>
      <div class="verdict-card ou-card"><span class="verdict-icon">${p.pickOU==='over'?'📈':'📉'}</span><div><div class="verdict-title">▶ ${p.pickOULabel}</div><div class="verdict-reason">${p.pickOUReason}</div></div></div>
    </div>
    <div class="conf-row">
      <span class="conf-label">ความมั่นใจ</span>
      <div class="conf-track"><div class="conf-fill" style="width:${p.conf}%;background:${cc}"></div></div>
      <span class="conf-pct" style="color:${cc}">${p.conf}%</span>
    </div>
  </div>
</div>`;
}

function tog(i){
  if(open.has(i))open.delete(i);else open.add(i);
  document.getElementById('c'+i)?.classList.toggle('open',open.has(i));
}

renderTabs();
renderMatches();
</script>
</body>
</html>

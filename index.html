<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>5 คู่เด็ด · วิเคราะห์บอลรายวัน</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e1a;--sf:#111827;--sf2:#1a2235;--bd:rgba(255,255,255,0.07);--g:#00d68f;--gd:rgba(0,214,143,0.12);--gg:rgba(0,214,143,0.25);--b:#3b82f6;--bd2:rgba(59,130,246,0.12);--am:#f59e0b;--amd:rgba(245,158,11,0.12);--r:#ef4444;--tx:#f1f5f9;--mu:#64748b;--mu2:#94a3b8;--fh:'Barlow Condensed',sans-serif;--fb:'Sarabun',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,214,143,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,214,143,0.025) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
.wrap{max-width:480px;margin:0 auto;padding:0 16px 90px;position:relative;z-index:1;}
.hdr{padding:24px 0 16px;display:flex;align-items:center;justify-content:space-between;}
.lb{display:flex;align-items:center;gap:10px;}
.li{width:42px;height:42px;background:var(--g);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 0 20px var(--gg);}
.an{font-family:var(--fh);font-size:22px;font-weight:800;letter-spacing:1px;line-height:1;}
.as{font-size:11px;color:var(--mu);margin-top:2px;}
.dc{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:6px 12px;font-size:12px;color:var(--mu2);}
.dc span{color:var(--g);font-weight:600;}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:7px 16px;border-radius:20px;border:1px solid var(--bd);background:var(--sf);font-size:12px;color:var(--mu2);cursor:pointer;transition:all 0.2s;}
.tab:hover{border-color:var(--g);color:var(--g);}
.tab.on{background:var(--g);border-color:var(--g);color:#0a0e1a;font-weight:600;box-shadow:0 0 12px var(--gg);}
.sb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px;}
.sx{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px 10px;text-align:center;}
.sn{font-family:var(--fh);font-size:26px;font-weight:700;line-height:1;}
.sl{font-size:10px;color:var(--mu);margin-top:4px;}
.slb{font-family:var(--fh);font-size:12px;font-weight:600;letter-spacing:2px;color:var(--mu);text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.slb::after{content:'';flex:1;height:1px;background:var(--bd);}
.mc{background:var(--sf);border:1px solid var(--bd);border-radius:16px;margin-bottom:12px;overflow:hidden;cursor:pointer;animation:fu 0.4s ease both;transition:border-color 0.2s,transform 0.15s;}
.mc:hover{border-color:rgba(255,255,255,0.15);transform:translateY(-1px);}
.mc.op{border-color:var(--g);}
.mc.op .arr{transform:rotate(180deg);}
@keyframes fu{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.mc:nth-child(1){animation-delay:.05s}.mc:nth-child(2){animation-delay:.1s}.mc:nth-child(3){animation-delay:.15s}.mc:nth-child(4){animation-delay:.2s}.mc:nth-child(5){animation-delay:.25s}
.ct{padding:14px 14px 0;}
.cm{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.lp{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--mu2);}
.ldot{width:6px;height:6px;border-radius:50%;}
.cr{display:flex;align-items:center;gap:6px;}
.sp{background:var(--amd);color:var(--am);border:1px solid rgba(245,158,11,0.25);border-radius:20px;padding:2px 8px;font-size:10px;font-weight:600;}
.pn{width:22px;height:22px;border-radius:50%;background:var(--gd);border:1px solid var(--g);color:var(--g);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.arr{width:18px;height:18px;color:var(--mu);transition:transform 0.25s;flex-shrink:0;}
.tr{display:grid;grid-template-columns:1fr 56px 1fr;align-items:center;gap:6px;padding-bottom:14px;}
.th{text-align:left;}.ta{text-align:right;}
.tn{font-family:var(--fh);font-size:15px;font-weight:700;line-height:1.2;}
.tn.pt{color:var(--g);}
.tt{font-size:10px;color:var(--mu);margin-top:3px;}
.vsc{text-align:center;}
.vt{font-family:var(--fh);font-size:13px;font-weight:700;color:var(--mu);letter-spacing:1px;}
.os{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--bd);}
.ob{text-align:center;padding:10px 6px;border-right:1px solid var(--bd);position:relative;}
.ob:last-child{border-right:none;}
.ob.pk{background:var(--gd);}
.ob.pk::after{content:'▲ เล่น';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--g);font-weight:700;}
.oldot{font-size:9px;color:var(--mu);margin-bottom:2px;}
.ovl{font-family:var(--fh);font-size:18px;font-weight:700;}
.ob.pk .ovl{color:var(--g);}
.dp{display:none;padding:14px;border-top:1px solid var(--bd);background:var(--sf2);}
.mc.op .dp{display:block;animation:sd 0.2s ease;}
@keyframes sd{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
.dt{font-size:10px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.ds{margin-bottom:14px;}
.wb{margin-bottom:6px;}
.wbt{display:flex;justify-content:space-between;font-size:11px;color:var(--mu2);margin-bottom:3px;}
.wbk{height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;}
.wbf{height:100%;border-radius:2px;}
.oug{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.oui{background:rgba(255,255,255,0.04);border-radius:10px;padding:8px 10px;}
.oul{font-size:10px;color:var(--mu);margin-bottom:3px;}
.ouv{font-family:var(--fh);font-size:16px;font-weight:700;}
.vg{display:grid;gap:8px;margin-bottom:12px;}
.vc2{border-radius:10px;padding:10px 12px;display:flex;align-items:flex-start;gap:10px;}
.vc2.wc{background:var(--gd);border:1px solid rgba(0,214,143,0.2);}
.vc2.oc{background:var(--bd2);border:1px solid rgba(59,130,246,0.2);}
.vi{font-size:18px;line-height:1;margin-top:1px;flex-shrink:0;}
.vl{font-size:13px;font-weight:600;margin-bottom:2px;}
.vc2.wc .vl{color:var(--g);}.vc2.oc .vl{color:var(--b);}
.vr{font-size:11px;color:var(--mu2);line-height:1.5;}
.cfr{display:flex;align-items:center;gap:8px;}
.cfl{font-size:11px;color:var(--mu);min-width:65px;}
.cft{flex:1;height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;}
.cff{height:100%;border-radius:2px;}
.cfp{font-family:var(--fh);font-size:14px;font-weight:700;min-width:36px;text-align:right;}
.fr{display:flex;align-items:center;justify-content:space-between;}
.fds{display:flex;gap:3px;}
.fd{width:18px;height:18px;border-radius:50%;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--bg);}
.fd.W{background:var(--g);}.fd.D{background:var(--mu);}.fd.L{background:var(--r);}
.fn{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-top:20px;display:flex;align-items:flex-start;gap:10px;font-size:11px;color:var(--mu2);line-height:1.6;}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(10,14,26,0.96);backdrop-filter:blur(12px);border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 0 16px;z-index:100;}
.ni{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--mu);cursor:pointer;padding:4px;transition:color 0.2s;}
.ni.on{color:var(--g);}
.ico{font-size:20px;}
.lw{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:16px;}
.spin{width:36px;height:36px;border:3px solid var(--bd);border-top-color:var(--g);border-radius:50%;animation:sp 0.8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.ltx{font-size:13px;color:var(--mu2);text-align:center;}
.bdgx{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:4px 12px;font-size:10px;margin-bottom:16px;background:var(--gd);border:1px solid rgba(0,214,143,0.2);color:var(--g);}
.ldx{width:6px;height:6px;border-radius:50%;background:var(--g);animation:bl 1.5s ease infinite;}
@keyframes bl{0%,100%{opacity:1;}50%{opacity:.3;}}
.cached-note{font-size:10px;color:var(--mu);text-align:center;margin-bottom:8px;}
</style>
</head>
<body>
<div class="wrap">
<div class="hdr">
  <div class="lb">
    <div class="li">&#9917;</div>
    <div><div class="an">5 คู่เด็ด</div><div class="as">วิเคราะห์บอลรายวัน</div></div>
  </div>
  <div class="dc"><span id="dlb">&#8212;</span></div>
</div>
<div class="bdgx"><span class="ldx"></span> AI วิเคราะห์จริงทุกวัน</div>
<div class="tabs" id="tabs"></div>
<div class="sb">
  <div class="sx"><div class="sn" id="sn1" style="color:var(--g)">5</div><div class="sl">คู่เด็ดวันนี้</div></div>
  <div class="sx"><div class="sn" id="sn2">—</div><div class="sl">สูง ↑ / ต่ำ ↓</div></div>
  <div class="sx"><div class="sn" id="sn3">—</div><div class="sl">ความมั่นใจเฉลี่ย</div></div>
</div>
<div class="slb">คู่เด็ดประจำวัน</div>
<div id="cached-note" class="cached-note" style="display:none"></div>
<div id="ml"></div>
<div class="fn"><span style="font-size:16px;flex-shrink:0">⚠️</span><span>การวิเคราะห์บอลไม่มีการันตี 100% ใช้เป็นข้อมูลประกอบการตัดสินใจเท่านั้น เล่นในสิ่งที่รับได้ครับ</span></div>
</div>
<div class="nav">
  <div class="ni on"><span class="ico">🎯</span><span>คู่เด็ด</span></div>
  <div class="ni"><span class="ico">📊</span><span>สถิติ</span></div>
  <div class="ni"><span class="ico">⚽</span><span>โปรแกรม</span></div>
  <div class="ni"><span class="ico">⚙️</span><span>ตั้งค่า</span></div>
</div>

<script>
const LC = {'พรีเมียร์ลีก':'#4F46E5','ลาลีกา':'#D85A30','บุนเดสลีกา':'#E24B4A','เซเรียอา':'#1D9E75','ลีกเอิง':'#185FA5','แชมเปียนส์ลีก':'#BA7517','ยูโรป้าลีก':'#D85A30','อื่นๆ':'#64748b'};

let sel=0, opn=new Set(), cache={};

function iso(o){const d=new Date();d.setDate(d.getDate()+o);return d.toISOString().split('T')[0];}
function dlb(o){if(o===-1)return'เมื่อวาน';if(o===0)return'วันนี้';if(o===1)return'พรุ่งนี้';const d=new Date();d.setDate(d.getDate()+o);return['อา','จ','อ','พ','พฤ','ศ','ส'][d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1);}
function fullD(o){const d=new Date();d.setDate(d.getDate()+o);const m=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];return d.getDate()+' '+m[d.getMonth()]+' '+(d.getFullYear()+543);}

function renderTabs(){
  document.getElementById('tabs').innerHTML=[-1,0,1,2,3].map(o=>`<button class="tab${o===sel?' on':''}" onclick="pd(${o})">${dlb(o)}</button>`).join('');
  document.getElementById('dlb').textContent=fullD(sel);
}
function pd(o){sel=o;opn.clear();renderTabs();run();}

function showLoad(msg){
  document.getElementById('ml').innerHTML=`<div class="lw"><div class="spin"></div><div class="ltx">${msg||'AI กำลังวิเคราะห์คู่บอลวันนี้...<br><small style="color:var(--mu);font-size:11px">อาจใช้เวลา 10-15 วินาที</small>'}</div></div>`;
}

async function fetchAI(dateStr){
  // Check localStorage cache
  const cacheKey = 'picks_'+dateStr;
  const cached = localStorage.getItem(cacheKey);
  if(cached){
    try{
      const parsed = JSON.parse(cached);
      const age = Date.now() - parsed.ts;
      if(age < 6*3600*1000){ // cache 6 hours
        document.getElementById('cached-note').style.display='block';
        document.getElementById('cached-note').textContent='⚡ โหลดจาก cache · อัปเดตทุก 6 ชม.';
        return parsed.data;
      }
    }catch(e){}
  }
  document.getElementById('cached-note').style.display='none';

  const prompt = `Reply ONLY with a valid JSON array, no explanation, no markdown.
Pick 5 best football matches for ${dateStr} from top leagues (Premier League, La Liga, Bundesliga, Serie A, Ligue 1, Champions League).
Each object must have exactly these fields:
{"league":"","home":"","away":"","time":"HH:MM","homeOdds":0.0,"drawOdds":0.0,"awayOdds":0.0,"pickWin":"home","pickWinLabel":"","pickWinReason":"","ouLine":2.5,"overOdds":0.0,"underOdds":0.0,"pickOU":"over","pickOULabel":"","pickOUReason":"","homeWin":0,"draw":0,"awayWin":0,"conf":0,"star":true,"homeForm":"WWDLW","awayForm":"WLDWW"}
Use Thai language for league/team names and reasons. Output valid JSON only.`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 4000,
      messages: [{role:'user', content: prompt}]
    })
  });

  if(!res.ok) throw new Error('API error '+res.status);
  const data = await res.json();
  const text = data.content[0].text.trim();
  const clean = text.replace(/```json|```/g,'').trim();
  // Extract JSON array robustly
  const start = clean.indexOf('[');
  const end = clean.lastIndexOf(']');
  if(start === -1 || end === -1) throw new Error('No JSON array found');
  const jsonStr = clean.slice(start, end+1);
  const picks = JSON.parse(jsonStr);

  // Save to cache
  localStorage.setItem(cacheKey, JSON.stringify({ts: Date.now(), data: picks}));
  return picks;
}

function renderM(picks){
  const ov=picks.filter(p=>p.pickOU==='over').length, un=picks.length-ov;
  const ac=picks.length?Math.round(picks.reduce((a,p)=>a+p.conf,0)/picks.length):0;
  document.getElementById('sn1').textContent=picks.length;
  document.getElementById('sn2').innerHTML=`<span style="color:var(--g)">${ov}↑</span> · <span style="color:var(--b)">${un}↓</span>`;
  document.getElementById('sn3').innerHTML=ac+'<span style="font-size:14px;font-weight:400">%</span>';
  document.getElementById('ml').innerHTML=picks.map((p,i)=>crd(p,i)).join('');
}

function crd(p,i){
  const hi=p.pickWin==='home', ai=p.pickWin==='away';
  const lc=LC[p.league]||'#64748b';
  const cc=p.conf>=78?'var(--g)':p.conf>=65?'var(--am)':'var(--r)';
  const fd=f=>f.split('').map(c=>`<div class="fd ${c}">${c}</div>`).join('');
  const io=opn.has(i);
  return`<div class="mc${io?' op':''}" id="c${i}" onclick="tg(${i})">
<div class="ct"><div class="cm">
<div class="lp"><span class="ldot" style="background:${lc}"></span>${p.league}</div>
<div class="cr">${p.star?'<div class="sp">⭐ 5 ดาว</div>':''}<div class="pn">${i+1}</div>
<svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
</div></div>
<div class="tr">
<div class="th"><div class="tn${hi?' pt':''}">${p.home}</div><div class="tt">${p.time} น.</div></div>
<div class="vsc"><div class="vt">VS</div></div>
<div class="ta"><div class="tn${ai?' pt':''}">${p.away}</div></div>
</div></div>
<div class="os">
<div class="ob${hi?' pk':''}"><div class="oldot">เจ้าบ้าน</div><div class="ovl">${(+p.homeOdds).toFixed(2)}</div></div>
<div class="ob"><div class="oldot">เสมอ</div><div class="ovl">${(+p.drawOdds).toFixed(2)}</div></div>
<div class="ob${ai?' pk':''}"><div class="oldot">ทีมเยือน</div><div class="ovl">${(+p.awayOdds).toFixed(2)}</div></div>
</div>
<div class="dp">
<div class="ds"><div class="dt">โอกาสชนะ (%)</div>
<div class="wb"><div class="wbt"><span>${p.home}</span><span>${p.homeWin}%</span></div><div class="wbk"><div class="wbf" style="width:${p.homeWin}%;background:var(--g)"></div></div></div>
<div class="wb"><div class="wbt"><span>เสมอ</span><span>${p.draw}%</span></div><div class="wbk"><div class="wbf" style="width:${p.draw}%;background:var(--mu)"></div></div></div>
<div class="wb"><div class="wbt"><span>${p.away}</span><span>${p.awayWin}%</span></div><div class="wbk"><div class="wbf" style="width:${p.awayWin}%;background:var(--b)"></div></div></div>
</div>
<div class="ds"><div class="dt">สูง / ต่ำ</div>
<div class="oug">
<div class="oui"><div class="oul">เส้น</div><div class="ouv">${p.ouLine} ประตู</div></div>
<div class="oui"><div class="oul">โอดส์ สูง/ต่ำ</div><div class="ouv">${(+p.overOdds).toFixed(2)} / ${(+p.underOdds).toFixed(2)}</div></div>
</div></div>
<div class="ds"><div class="dt">ฟอร์ม 5 นัดล่าสุด</div>
<div class="fr"><div class="fds">${fd(p.homeForm||'WWDLW')}</div><div style="font-size:10px;color:var(--mu)">VS</div><div class="fds">${fd(p.awayForm||'WLDWW')}</div></div>
</div>
<div class="vg">
<div class="vc2 wc"><span class="vi">🏆</span><div><div class="vl">▶ ${p.pickWinLabel}</div><div class="vr">${p.pickWinReason}</div></div></div>
<div class="vc2 oc"><span class="vi">${p.pickOU==='over'?'📈':'📉'}</span><div><div class="vl">▶ ${p.pickOULabel}</div><div class="vr">${p.pickOUReason}</div></div></div>
</div>
<div class="cfr"><span class="cfl">ความมั่นใจ</span>
<div class="cft"><div class="cff" style="width:${p.conf}%;background:${cc}"></div></div>
<span class="cfp" style="color:${cc}">${p.conf}%</span>
</div>
</div></div>`;
}

function tg(i){if(opn.has(i))opn.delete(i);else opn.add(i);document.getElementById('c'+i)?.classList.toggle('op',opn.has(i));}

async function run(){
  showLoad();
  try{
    const picks = await fetchAI(iso(sel));
    renderM(picks);
  }catch(e){
    console.error(e);
    document.getElementById('ml').innerHTML=`<div style="text-align:center;padding:40px 20px;">
      <div style="font-size:32px;margin-bottom:12px">😅</div>
      <div style="font-size:14px;font-weight:500;color:var(--r);margin-bottom:8px">ดึงข้อมูลไม่ได้</div>
      <div style="font-size:12px;color:var(--mu2);margin-bottom:16px">${e.message}</div>
      <button onclick="run()" style="background:var(--g);color:#0a0e1a;border:none;border-radius:20px;padding:9px 24px;font-size:13px;font-weight:600;cursor:pointer;">ลองอีกครั้ง</button>
    </div>`;
  }
}

renderTabs();
run();
</script>
</body>
</html>
